schema: 2
change_id: <change-id>
summary: <concise implementation summary>

effective_policy:
  components: []
  unowned_paths: []
  project_policy_digest: <64-character sha256 digest>
  required_validation: []

tasks:
  - id: 1
    title: <task title>
    description: <specific sequential implementation work>
    affected_paths:
      - <project-relative path>
    anchors:
      - <symbol, heading, or line reference>
    restrictions:
      - <scope or safety constraint>
    validation:
      - command: <exact command>
        cwd: .
        timeout_ms: 120000
        required: true
        source: <manifest, task runner, CI workflow, or existing documentation>

documentation:
  impact: none # none | update | new
  files: []
