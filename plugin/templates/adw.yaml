# ADW project configuration. Commands must cite an observable project source.
schema: 3

git:
  default_branch: main

documentation:
  mode: branch
  branch: docs
  worktree: worktrees/docs
  sync_marker: SYNC.yaml
  delivery: direct-push

execution:
  isolation: managed-devcontainer
  enforcement: required

components:
  app:
    path: .

validation:
  default:
    - command: "<replace with a verified command>"
      source: "<manifest, task runner, CI workflow, or existing documentation>"
      required: true

