# ADW project configuration. Small, handwritten, and readable without schema
# documentation. Every generated command cites an observable project source.
adw: 1

git:
  base_branch: main

docs:
  branch: docs
  worktree: worktrees/docs
  # sync_marker: SYNC.yaml

execution:
  # orchestrated  runs the independent groups of one phase in parallel worktrees
  # sequential    runs one branch and worktree at a time
  mode: orchestrated
  # provider-sandbox      lightweight default; the agent provider's own sandbox
  # project-devcontainer  an existing project-owned container, left unchanged
  # managed-devcontainer  the generated reproducible hardened container
  isolation: provider-sandbox
  # Managed devcontainer only: public-pages | hosted-only
  # web_access: public-pages

# Optional. Record the versions chosen during initialization when the
# repository does not declare a precise runtime version itself.
# development:
#   runtime_versions:
#     dotnet: "8"

# At least one component. A single root component uses path ".".
# Each entry of `validate` is either an exact command string or an object with
# `command` and optional `cwd`, `timeout_ms`, `required`, and `source`.
components:
  app:
    path: "."
    validate: []

# Optional. Omit every capability the project does not use.
# providers:
#   work_tracker:
#     provider: azure-devops
#     required: false
#     transport: auto
#     access: read-write
#     settings:
#       organization: "<organization>"
#       project: "<project>"
#   code_host:
#     provider: github
#     required: false

# Optional plain-language conventions. They guide formatting and never
# authorize external writes, merging, deployment, or release.
# conventions:
#   branches: Use ADW branch names.
#   pull_requests: Keep group pull requests small and draft until reviewed.
