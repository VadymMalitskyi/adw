# ADW project policy — optional shared overrides to discovery and safe defaults.
#
# `adw:init` generates this file; this template documents every field it may
# contain. Omit this file entirely when no shared override is needed. Unknown
# keys are rejected rather than ignored, and no key anywhere in
# this file may look like a credential.
adw: 1

# Optional. ADW otherwise derives the base branch from Git.
# git:
#   base_branch: main

# Optional. Documentation and plans live on their own orphan branch, checked
# out as a worktree. Defaults are branch `docs` at `worktrees/docs`; the
# worktree must stay under `worktrees/`, which ADW keeps ignored on the base
# branch. `adw:init` creates the branch and attaches the worktree.
# docs:
#   branch: docs
#   worktree: worktrees/docs

# Optional. `adw:init` defaults to `managed-devcontainer`; an absent project
# policy outside initialization still uses the lightweight provider sandbox.
# execution:
#   # provider-sandbox      lightweight; the agent provider's own sandbox
#   # project-devcontainer  an existing project-owned container, left unchanged
#   # managed-devcontainer  the generated reproducible hardened container
#   isolation: managed-devcontainer
#   # Managed devcontainer only: public-pages | hosted-only
#   # web_access: public-pages

# Optional. Record a runtime version only when the repository does not pin one
# itself. Supported: node, python, go, rust, java, ruby, dotnet.
# development:
#   runtime_versions:
#     dotnet: "8"

# Optional override when repository discovery cannot establish boundaries or
# validation commands. A single root component uses path ".".
# Each `validate` entry is either an exact command string or an object with
# `command` and optional `cwd`, `timeout_ms`, `required`, and `source`.
# components:
#   app:
#     path: "."
#     validate: []

# Optional. Omit every capability the project does not use. `domains` lists the
# hostnames the managed container must be able to reach for that provider.
# providers:
#   code_host:
#     provider: github
#     required: false
#     transport: auto
#     access: read-write
#     domains:
#       - api.github.com
#   work_tracker:
#     provider: azure-devops
#     required: false
#     settings:
#       organization: "example-org"
#       project: "example-project"

# Optional provider-operation approval policy. Defaults are read=allow,
# writes=ask, and destructive operations=deny. Exact tool names bind MCP/app
# calls to an operation. Deny safety floors cannot be weakened.
# permissions:
#   providers:
#     github:
#       app: github
#       mcp_server: github
#       operations:
#         comment: allow
#       tools:
#         add_comment: comment
